<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天璣閣</title>
    <link rel="icon" type="image/png" href="./gyeongbokgung-palace.png">
    <link rel="apple-touch-icon" href="./icon-v2.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-v2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>
    :root {
    --palace-green: #2e4f39;       /* 宮廷墨綠 */
    --palace-gold: #d8c69c;        /* 宮金色 */
    --palace-paper: #faf7f1;       /* 古紙象牙白 */
    --palace-red: #9c3a2f;         /* 宮廷暗紅 */
    --palace-dark: #2a2a2a;        /* 墨色文字 */
    --palace-silk: #e7dbc0;        /* 絲綢米色 */
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Zen Maru Gothic', serif;
    color: var(--palace-dark);

    /* 仿古背景（絲綢暗紋） */
    background: 
        linear-gradient(135deg, rgba(255,255,255,0.1) 25%, transparent 25%) 0 0,
        linear-gradient(225deg, rgba(255,255,255,0.1) 25%, transparent 25%) 0 0,
        linear-gradient(315deg, rgba(255,255,255,0.1) 25%, transparent 25%) 0 0;
    background-size: 50px 50px;
    background-color: var(--palace-green);

    min-height: 100vh;
    overflow-x: hidden;
}

/* --- 頂部宮廷標籤 --- */
.status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: rgba(240, 232, 210, 0.25);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(216, 198, 156, 0.4);
    position: sticky;
    top: 0;
    z-index: 10;
}

.location-pill {
    background: var(--palace-red);
    color: var(--palace-paper);
    padding: 6px 18px;
    border-radius: 20px;
    font-weight: bold;
    border: 2px solid var(--palace-paper);
}

.update-pill {
    font-size: 0.85rem;
    color: var(--palace-paper);
    background: rgba(0,0,0,0.25);
    padding: 5px 10px;
    border-radius: 12px;
}

/* 容器 */
.container {
    padding: 25px;
    max-width: 600px;
    margin: 0 auto;
}

/* --- Hero 主卡片（仿古卷軸） --- */
.hero-card {
    background: var(--palace-paper);
    border-radius: 25px;
    border: 3px solid var(--palace-gold);
    padding: 30px 25px;
    text-align: center;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    position: relative;
    margin-bottom: 25px;
}

.hero-period {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--palace-red);
    color: var(--palace-paper);
    padding: 6px 20px;
    border-radius: 16px;
    border: 2px solid var(--palace-paper);
    font-weight: bold;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

/* 主溫度區 */
.hero-temp-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
}

.hero-icon {
    font-size: 4.5rem;
    animation: float 4s infinite ease-in-out;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

.hero-temp {
    font-size: 4.2rem;
    font-weight: 900;
    color: var(--palace-dark);
}

.hero-desc {
    font-size: 1.4rem;
    margin-bottom: 15px;
    color: #5a4e47;
    font-weight: bold;
}

/* --- 宮廷建議兩格 --- */
.advice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    padding-top: 20px;
    border-top: 2px dashed var(--palace-gold);
}

.advice-item {
    background: var(--palace-silk);
    border-radius: 18px;
    padding: 15px;
    text-align: center;
    border: 1px solid var(--palace-gold);
}

.advice-icon {
    font-size: 2rem;
    margin-bottom: 8px;
}

.advice-text {
    font-size: 1.3rem;
    font-weight: bold;
    color: var(--palace-red);
    margin-bottom: 4px;
}

/* --- 小預報卡（橫向捲動） --- */
.section-title {
    font-size: 1.2rem;
    color: var(--palace-paper);
    margin-bottom: 12px;
    font-weight: bold;
    margin-left: 8px;
}

.scroll-container {
    display: flex;
    overflow-x: auto;
    gap: 15px;
    padding-bottom: 12px;
    scrollbar-width: none;
}
.scroll-container::-webkit-scrollbar {
    display: none;
}

.mini-card {
    min-width: 130px;
    background: var(--palace-paper);
    border-radius: 18px;
    border: 2px solid var(--palace-gold);
    padding: 15px 12px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

.mini-time {
    background: var(--palace-red);
    color: var(--palace-paper);
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 0.8rem;
    font-weight: bold;
    display: inline-block;
    margin-bottom: 10px;
}

.mini-icon {
    font-size: 2.3rem;
}

.mini-temp {
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--palace-dark);
}

/* --- Loading 畫面 --- */
.loading-screen {
    position: fixed;
    inset: 0;
    background: var(--palace-green);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.loading-screen p {
    color: var(--palace-paper);
    font-size: 1.1rem;
    margin-top: 15px;
    letter-spacing: 1px;
}
</style>

</head>

<body>
    <div id="loading" class="loading-screen">
        <div style="font-size: 4rem; animation: bounce 2s infinite;">☁️</div>
        <p style="color: white; font-weight: bold; margin-top: 20px;">御覽雲翳，片刻回報...</p>
    </div>
    <div class="status-bar">
        <div class="location-pill">🛕 臺中府</div>
        <div id="updateTime" class="update-pill">待朝回報...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">

        <div id="heroCard">
        </div>

        <h3 class="section-title">天象預聞</h3>
        <div class="scroll-container" id="futureForecasts">
        </div>

    </div>

    <div style="max-width:600px;margin:18px auto 30px;padding:8px 12px;border-radius:14px;background:var(--palace-silk);border:1px solid rgba(216,198,156,0.35);box-shadow:0 6px 12px rgba(0,0,0,0.06);text-align:center;font-size:0.85rem;color:var(--palace-dark);">
        <a href="https://www.flaticon.com/free-icons/south-korea" title="south korea icons" style="color:var(--palace-red);text-decoration:none;font-weight:700;">
            Icon 來源：South korea icons created by Victoruler - Flaticon
        </a>
    </div>

    <script>
        const API_URL = "https://weather-test-seven.zeabur.app/api/weather/kaohsiung";

        function getWeatherIcon(weather) {
    if (!weather) return "🏵️🌤"; // 默认：古風晴多雲
    if (weather.includes("晴")) return "🏵️🌞";   // 宮廷日章
    if (weather.includes("多雲")) return "🏵️🌤"; // 帶紋飾多雲
    if (weather.includes("陰")) return "🏵️☁️";  // 柔霧陰天
    if (weather.includes("雨")) return "💠🌧";   // 青藍宮廷雨滴
    if (weather.includes("雷")) return "💠⛈";   // 金邊雷雲
    return "🏵️🌤";
}

function getAdvice(rainProb, maxTemp) {

    // ——雨具（宮廷風）——
    let rainIcon = "🎐";  // 風鈴象徵晴朗
    let rainText = "天清氣朗，無須持傘";

    if (parseInt(rainProb) > 30) {
        rainIcon = "🌂"; // 古風傘
        rainText = "天有不測之雨，宜備傘在側";
    }

    // ——穿搭（宮廷優雅）——
    let clothIcon = "👘";  
    let clothText = "雅服整齊";

    if (parseInt(maxTemp) >= 28) {
        clothIcon = "🪭";   // 扇子：炎熱、清涼
        clothText = "宜著薄裳以解暑";
    } else if (parseInt(maxTemp) <= 20) {
        clothIcon = "🧣";   // 優雅圍巾
        clothText = "宜添裘衣以禦寒";
    }

    return { rainIcon, rainText, clothIcon, clothText };
}


        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 5 && hour < 11) return "清晨時分";
            if (hour >= 11 && hour < 14) return "日中時候";
            if (hour >= 14 && hour < 18) return "午後時光";
            if (hour >= 18 && hour < 23) return "入夜時分";
            return "深宵之刻";
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            // 1. 渲染 Hero Card (主畫面)
            const advice = getAdvice(current.rain, current.maxTemp);
            const period = getTimePeriod(current.startTime);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            document.getElementById('heroCard').innerHTML = `
                        <div class="hero-card">
                            <div class="hero-period">${period}</div>
                            <div class="hero-temp-container">
                                <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
                                <div class="hero-temp">${avgTemp}°</div>
                            </div>
                            <div class="hero-desc">${current.weather} · 宮觀</div>
                            
                            <div class="advice-grid">
                                <div class="advice-item">
                                    <div class="advice-icon">${advice.rainIcon}</div>
                                    <div class="advice-text">${advice.rainText}</div>
                                    <div style="font-size:0.7rem; color:#999">降雨之兆 ${current.rain}</div>
                                </div>
                                <div class="advice-item">
                                    <div class="advice-icon">${advice.clothIcon}</div>
                                    <div class="advice-text">${advice.clothText}</div>
                                    <div style="font-size:0.7rem; color:#999">上限 ${current.maxTemp}°</div>
                                </div>
                            </div>
                        </div>
                    `;

            // 2. 渲染稍後預報 (包含明天判斷)
            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';

            // 抓今天的日期數字 (例如 24)
            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime);

                // 判斷該預報的日期是否跟今天不同，不同就是明天
                const fDate = new Date(f.startTime);
                if (fDate.getDate() !== todayDate) {
                    p = "翌日" + p;
                }

                scrollContainer.innerHTML += `
                            <div class="mini-card">
                                <div class="mini-time">${p}</div>
                                <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                                <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                                <div style="font-size:0.8rem; color:#888; margin-top:5px;">💧降雨兆：${f.rain}</div>
                            </div>
                        `;
            });

            // 3. 右上角顯示今日日期
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayIndex = now.getDay();
            const days = ["休沐日", "一更日", "二更日", "三更日", "四更日", "五更日", "六更日"];

            document.getElementById('updateTime').textContent = `${month}月${date}日 ${days[dayIndex]} · 宮時`;
        }

        async function fetchWeather() {
            try {
                // 1. 定義「最低等待時間」：1500 毫秒 (1.5秒)
                const delayPromise = new Promise(resolve => setTimeout(resolve, 1500));

                // 2. 定義「抓取資料」的工作
                const fetchPromise = fetch(API_URL).then(res => res.json());

                // 3. Promise.all 會等待「兩個都完成」才會往下走
                // result 陣列裡，第一個是 delay 的結果(沒用到)，第二個是 api 的 json 資料
                const [_, json] = await Promise.all([delayPromise, fetchPromise]);

                if (json.success) {
                    renderWeather(json.data);

                    // 資料處理好後，隱藏 Loading，顯示主畫面
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                } else {
                    throw new Error("API Error");
                }
            } catch (e) {
                console.error(e);
                alert("天象未呈，資料未能上奏朝廷！");
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
</body>

</html>
